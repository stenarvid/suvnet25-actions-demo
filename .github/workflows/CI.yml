name: Node.js CI

on:
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
    - run: npm ci
    - run: npm run lint
    - run: nom run type-check
    - run: npm run build --if-present
    - run: npm test --if-present
